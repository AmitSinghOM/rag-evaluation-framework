[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rageval"
version = "0.0.1"
description = "A framework for measuring retrieval quality (Recall@K, Precision@K, MRR, NDCG)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rageval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
