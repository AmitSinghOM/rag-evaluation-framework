name: release

# A tag push v* builds once, uploads to TestPyPI and attaches the files to a
# GitHub Release. The real PyPI job runs only from a manual run on a tag with
# confirm = "publish", so a tag alone can never reach PyPI. Uploads use Trusted
# Publishing (OIDC): there is no password or API token anywhere.
# Steps and one-time setup: docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Leave empty to upload to TestPyPI only. Type publish to upload to the
          real PyPI instead (run it on a tag).
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a confirm that would not do what it says
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          case "$CONFIRM" in
            "") ;;
            publish)
              if [[ "$REF" != refs/tags/v* ]]; then
                echo "::error::confirm=publish needs a run on a v* tag, not $REF"
                exit 1
              fi ;;
            *) echo "::error::confirm must be empty or exactly 'publish'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet --disable-pip-version-check build==1.6.1 twine==7.0.0
          python -m build
          twine check --strict dist/*

      - name: A tag must name the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=$TAG version=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: upload to TestPyPI
    needs: build
    if: github.event_name == 'push' || inputs.confirm == ''
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rag-evaluation-framework
    permissions:
      id-token: write # Trusted Publishing (OIDC); no stored credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub Release with the built files
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }} # the run's own short-lived token, not a stored secret
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes "${flags[@]}"

  pypi:
    name: upload to PyPI (manual run on a tag, confirm = publish)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rag-evaluation-framework
    permissions:
      id-token: write # Trusted Publishing (OIDC); no stored credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
