name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # setup-python's pip cache defaults to **/requirements.txt and fails
          # the job when no such file exists; the dev extra lives in pyproject.
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Runtime install has no third-party dependencies
        # A user install must bring nothing but rageval itself.
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/user-venv"
          "$RUNNER_TEMP/user-venv/bin/python" -m pip install --quiet .
          "$RUNNER_TEMP/user-venv/bin/python" -m pip list --format=freeze --exclude pip --exclude setuptools \
            | tee installed.txt
          test "$(grep -vc '^rag-evaluation-framework==' installed.txt)" -eq 0
          "$RUNNER_TEMP/user-venv/bin/python" -c "import rageval; print(rageval.__version__)"

  build:
    name: build (sdist + wheel, install the wheel, quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build and check the distributions
        # Same commands and pins as .github/workflows/release.yml.
        run: |
          python -m pip install --quiet --disable-pip-version-check build==1.6.1 twine==7.0.0
          python -m build
          twine check --strict dist/*
          ls -l dist

      - name: The sdist carries examples/toy and no tests; the wheel carries py.typed
        # MANIFEST.in is the rule; this is the check on the built files.
        shell: bash
        run: |
          set -euo pipefail
          tar tzf dist/*.tar.gz | sed 's#^[^/]*/##' | sort > sdist.txt
          for f in examples/toy/qrels.txt examples/toy/run_a.txt examples/toy/run_b.txt examples/toy/dataset.jsonl LICENSE README.md; do
            grep -qx "$f" sdist.txt || { echo "::error::sdist lacks $f"; exit 1; }
          done
          if grep -qE '^(tests/|examples/scifact/|\.github/)' sdist.txt; then
            echo "::error::sdist ships files it should not:"; grep -E '^(tests/|examples/scifact/|\.github/)' sdist.txt; exit 1
          fi
          unzip -l dist/*.whl | grep -q ' rageval/py.typed$' || { echo "::error::wheel lacks py.typed"; exit 1; }
          if unzip -l dist/*.whl | grep -qE ' (tests/|examples/)'; then echo "::error::wheel ships tests or examples"; exit 1; fi

      - name: Install the wheel in a clean venv and run the toy quickstart
        # Runs from $RUNNER_TEMP so `python -m rageval` cannot import the
        # checkout's source tree instead of the installed wheel.
        shell: bash
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE"
          toy="$src/examples/toy"
          name=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m venv "$RUNNER_TEMP/wheel-venv"
          bin="$RUNNER_TEMP/wheel-venv/bin"
          "$bin/python" -m pip install --quiet --disable-pip-version-check "$src"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$bin/python" -m pip list --format=freeze --exclude pip --exclude setuptools | tee installed.txt
          test "$(cat installed.txt)" = "$name==$version"
          test "$("$bin/rageval" --version)" = "rageval $version"
          test "$("$bin/python" -m rageval --version)" = "rageval $version"
          "$bin/python" -c "import rageval, sys; assert rageval.__file__.startswith(sys.prefix), rageval.__file__"
          "$bin/rageval" run --qrels "$toy/qrels.txt" --run "$toy/run_a.txt" --metrics ndcg@10,recall@100,mrr --out report_a.json
          "$bin/rageval" run --qrels "$toy/qrels.txt" --run "$toy/run_b.txt" --metrics ndcg@10,recall@100,mrr --out report_b.json
          "$bin/rageval" compare report_a.json report_b.json
          "$bin/python" -m rageval run --dataset "$toy/dataset.jsonl" --metrics ndcg@10,recall@100,mrr --out report_j.json
          "$bin/rageval" gate --baseline report_a.json --candidate report_b.json --metric ndcg@10 --max-drop 0.02 --metric recall@100 --max-drop 0.05
