name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Runtime install has no third-party dependencies
        # A user install must bring nothing but rageval itself.
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/user-venv"
          "$RUNNER_TEMP/user-venv/bin/python" -m pip install --quiet .
          "$RUNNER_TEMP/user-venv/bin/python" -m pip list --format=freeze --exclude pip --exclude setuptools \
            | tee installed.txt
          test "$(grep -vc '^rageval==' installed.txt)" -eq 0
          "$RUNNER_TEMP/user-venv/bin/python" -c "import rageval; print(rageval.__version__)"
